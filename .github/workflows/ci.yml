name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: "1.7.12"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install actionlint
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          tar -xzf "$archive" actionlint
          sudo install actionlint /usr/local/bin/actionlint
          rm -f actionlint "$archive" "actionlint_${ACTIONLINT_VERSION}_checksums.txt"
      - name: Lint workflows
        run: actionlint
      - name: Gate scripts
        run: |
          set -euo pipefail
          bash tools/check-release-permissions-test.sh
          bash tools/release-version-check-test.sh
          bash tools/macos-guard-test.sh
          bash tools/publish-args-test.sh
          bash tools/release-absent-test.sh
          bash tools/check-release-permissions.sh .github/workflows/*.yml
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$archive" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks "$archive" "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
      - name: Release gates
        env:
          FORBIDDEN_NAMES: ${{ secrets.FORBIDDEN_NAMES }}
        run: |
          if [ -z "$FORBIDDEN_NAMES" ]; then
            echo "::notice::FORBIDDEN_NAMES is not available (a pull request from a fork); the name gate is skipped"
            export SKIP_NAME_GATE=1
          fi
          tools/public-gates.sh

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config dbus-daemon dbus-bin gnome-keyring
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --lib --bins -- -D warnings
      - run: cargo clippy --workspace --tests --benches -- -D warnings -A clippy::unwrap_used -A clippy::expect_used -A clippy::panic
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Workspace tests on a private Secret Service
        env:
          ZS_TEST_NODE: node
          ZS_BUILD_TEST_ENDPOINTS: "1"
        run: |
          dbus-run-session -- bash -c '
            set -euo pipefail
            openssl rand -hex 16 | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            cargo test --workspace --locked
          '
      # The one ignored SSM test is a latency measurement that runs under the fake STS and SSM and
      # asserts the warm path adds no AWS call. The workspace run above skips it.
      - name: Ignored SSM latency test
        run: |
          set -euo pipefail
          log=$(mktemp)
          cargo test --locked -p zs-materializer --test aws_ssm -- --ignored | tee "$log"
          grep -Fq "test result: ok. 1 passed; 0 failed; 0 ignored;" "$log" || { echo "expected exactly 1 ignored SSM test to pass" >&2; exit 1; }
      # Row 102 needs a second OS account: the agent closes a database client whose user differs
      # from its own before it reads a byte. It runs in its own Secret Service session because the
      # agent needs a native credential store.
      - name: A database client of another OS user is refused
        run: |
          set -euo pipefail
          sudo useradd --no-create-home zs-other
          # A fresh keyring directory: the workspace step left a login keyring locked with its
          # own random password.
          XDG_DATA_HOME="$(mktemp -d)"
          export XDG_DATA_HOME
          dbus-run-session -- bash -c '
            set -euo pipefail
            openssl rand -hex 16 | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            ZS_OTHER_USER=zs-other cargo test --locked -p zs --test fail_closed_matrix -- --ignored --exact row_102_a_database_client_of_another_os_user_is_refused | tee /tmp/zs-other-user.log
            grep -Fq "test result: ok. 1 passed" /tmp/zs-other-user.log
          '
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo deny check

  caller-clients:
    # T8: every client the spec measured must still carry the run token, so this job refuses to
    # pass when a client is missing (ZS_REQUIRE_CLIENTS=1).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ZS_REQUIRE_CLIENTS: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config dbus-daemon dbus-bin gnome-keyring python3-requests
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"
      - name: Each measured client sends the run token
        run: |
          dbus-run-session -- bash -c '
            set -euo pipefail
            openssl rand -hex 16 | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            cargo test --locked -p zs --test caller_clients
          '

  conformance:
    # MongoDB 8.x refuses to start on the ubuntu-24.04 runner kernel (7.0.0, in the
    # affected range 6.19 through 7.0.13). The ubuntu-22.04 image runs 6.8.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config dbus-daemon dbus-bin gnome-keyring mysql-client-8.0 redis-tools
      - run: npm install -g mongosh@2.14.1
      - run: tools/db-test-certs.sh target/db-test-certs
      - run: docker compose --profile pgtls --profile mysql --profile mongo --profile redis up -d --wait postgres postgres-tls mysql mongo redis redis-tls
      - run: tools/mongo-test-setup.sh
      - run: cargo build --locked -p zs
      - name: Conformance suite on a private Secret Service
        env:
          ZS_CONFORMANCE_REQUIRE_FIXTURES: "1"
        run: |
          dbus-run-session -- bash -c '
            set -euo pipefail
            openssl rand -hex 16 | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            cargo test --locked -p zs-conformance
            cargo run --locked -p zs-conformance -- run --config crates/zs-conformance/conformance.toml
          '
      - if: failure()
        run: docker compose --profile pgtls --profile mysql --profile mongo --profile redis logs postgres postgres-tls mysql mongo redis redis-tls

  # A private repository must fail here instead of skipping both macOS jobs without notice.
  macos-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: tools/macos-guard.sh "${{ github.event.repository.private }}"

  # The macOS jobs run only while this repository is public: hosted macOS minutes are free on a
  # public repository and billed at ten times the Linux rate on a private one. On a private
  # repository the guard fails, so these two jobs are skipped after a failure, not without notice.
  macos-check:
    needs: macos-guard
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Create disposable keychain
        env:
          ZS_CI_KEYCHAIN: ${{ runner.temp }}/zerosecret-ci.keychain-db
        run: |
          set -euo pipefail
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$ZS_CI_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$ZS_CI_KEYCHAIN"
          security unlock-keychain -p "$password" "$ZS_CI_KEYCHAIN"
          security default-keychain -d user -s "$ZS_CI_KEYCHAIN"
          security list-keychains -d user -s "$ZS_CI_KEYCHAIN"
      # The H4 test runs a real Node `fetch` through the agent and needs Node 24 or later.
      # With ZS_TEST_NODE set, a missing or older Node fails the test instead of skipping it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Workspace tests on a disposable keychain
        run: cargo build --locked -p zs && cargo test --workspace --locked
        env:
          ZS_TEST_NODE: node
          ZS_BUILD_TEST_ENDPOINTS: "1"
      # Row 102 on macOS: the process walk sees only the agent user's processes, so a client of
      # another account is closed before a byte is read.
      - name: A database client of another OS user is refused
        env:
          ZS_BUILD_TEST_ENDPOINTS: "1"
        run: |
          set -euo pipefail
          sudo sysadminctl -addUser zs-other -password "$(openssl rand -hex 16)"
          ZS_OTHER_USER=zs-other cargo test --locked -p zs --test fail_closed_matrix -- --ignored --exact row_102_a_database_client_of_another_os_user_is_refused | tee "$RUNNER_TEMP/zs-other-user.log"
          grep -Fq "test result: ok. 1 passed" "$RUNNER_TEMP/zs-other-user.log"
      # Positive control for the release refusal below: the same check sees the names here.
      - run: strings target/debug/zs | grep -q ZS_TEST_AWS_RESOLVE
      # Build the release binaries first, as their own step. The budget tests measure
      # cold start and added latency against wall-clock budgets, so compiling in the same
      # step that times them puts a full cargo build in competition with the measurement:
      # cold start measures 151-262 ms idle but 427-550 ms under concurrent build load,
      # against a 400 ms budget. Separating the steps is what keeps the budgets honest
      # rather than widening them to absorb the runner's own noise.
      - run: cargo build --locked --release -p zs --tests
      # A release binary must not carry the test-endpoint names or their reader.
      - run: '! strings target/release/zs | grep -q ZS_TEST_'
      - run: cargo test --locked --release -p zs --test test_endpoints
      - run: cargo test --locked --release -p zs --test budget_latency --test budget_footprint
      # The steps above are the last to start the agent. Each agent-spawning test deletes
      # the exact record its CA directory names when its fixture drops, so this disposable
      # keychain must now hold no `zerosecret.ca.v1` record. A planted canary must be counted
      # exactly once first, so a count that sees nothing cannot pass as zero. Only this
      # disposable file is dumped, and without `-d`, which prints attributes and no secret.
      - name: No CA records left in the disposable keychain
        timeout-minutes: 2
        env:
          ZS_CI_KEYCHAIN: ${{ runner.temp }}/zerosecret-ci.keychain-db
        run: |
          set -euo pipefail
          count() {
            security dump-keychain "$ZS_CI_KEYCHAIN" | { grep -Fc '"svce"<blob>="zerosecret.ca.v1"' || true; }
          }
          security add-generic-password -a zs-ci-record-canary -s zerosecret.ca.v1 -w canary "$ZS_CI_KEYCHAIN"
          seen=$(count)
          security delete-generic-password -a zs-ci-record-canary -s zerosecret.ca.v1 "$ZS_CI_KEYCHAIN" > /dev/null
          left=$(count)
          echo "zerosecret.ca.v1 records: $seen with the canary, $left after deleting it"
          if [ "$seen" -ne 1 ] || [ "$left" -ne 0 ]; then
            echo "expected exactly the canary, then no zerosecret.ca.v1 record" >&2
            exit 1
          fi
      - name: Delete disposable keychain
        if: always()
        env:
          ZS_CI_KEYCHAIN: ${{ runner.temp }}/zerosecret-ci.keychain-db
        run: |
          security delete-keychain "$ZS_CI_KEYCHAIN"
          test ! -e "$ZS_CI_KEYCHAIN"
          ! security list-keychains -d user | grep -Fq "\"$ZS_CI_KEYCHAIN\""


  db-real:
    # MongoDB 8.x refuses to start on the ubuntu-24.04 runner kernel (7.0.0, in the
    # affected range 6.19 through 7.0.13). The ubuntu-22.04 image runs 6.8.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      ZS_REQUIRE_PG: "1"
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5434/zerosecret_test
      ZS_REQUIRE_MYSQL: "1"
      ZS_TEST_MYSQL: 127.0.0.1:3307
      ZS_TEST_MYSQL_PLAIN: 127.0.0.1:3308
      ZS_TEST_MYSQL_CLIENTS: "1"
      ZS_REQUIRE_PG_TLS: "1"
      ZS_TEST_PG_TLS: postgres://postgres:postgres@127.0.0.1:5435/zerosecret_test
      ZS_REQUIRE_MONGO: "1"
      ZS_TEST_MONGO: 127.0.0.1:27018
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config postgresql-client dbus-daemon dbus-bin gnome-keyring
      - run: tools/db-test-certs.sh target/db-test-certs
      - run: docker compose up -d --wait postgres mysql mysql-plain postgres-tls mongo
      - run: tools/mongo-test-setup.sh
      - run: for image in mysql:5.7 mysql:8.0 mysql:9; do docker pull -q "$image"; done
      - run: cargo test --locked -p zs-proto-mysql --test mysql_real -- --test-threads=1 --include-ignored --nocapture
        env:
          ZS_TEST_MYSQL_CERTS: ${{ github.workspace }}/target/db-test-certs
      - run: cargo test --locked -p zs-proto-mongo --test mongo_real -- --test-threads=1 --include-ignored --nocapture
        env:
          ZS_TEST_MONGO_CERTS: ${{ github.workspace }}/target/db-test-certs
      - name: Redis real tests
        env:
          ZS_TEST_REDIS_ADDR: 127.0.0.1:6380
          ZS_TEST_REDIS_PASSWORD: zs-test-redis
          ZS_TEST_REDIS_ACL_USER: zs_app
          ZS_TEST_REDIS_ACL_PASSWORD: zs-test-redis-acl
          ZS_TEST_REDIS_NOAUTH_ADDR: 127.0.0.1:6381
          ZS_TEST_REDIS_TLS_ADDR: 127.0.0.1:6382
          ZS_TEST_REDIS_CERTS: ${{ github.workspace }}/target/db-test-certs
        run: |
          set -euo pipefail
          docker compose --profile redis up -d --wait redis redis-open redis-tls
          cargo test --locked -p zs-proto-redis --test redis_real -- --test-threads=1 --include-ignored --nocapture
      - name: PostgreSQL real tests on a private Secret Service
        run: |
          dbus-run-session -- bash -c '
            set -euo pipefail
            openssl rand -hex 16 | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            cargo test --locked -p zs --test postgres_real -- --test-threads=1 --nocapture
          '
      - if: failure()
        run: docker compose --profile mysql --profile pgtls --profile mongo --profile redis logs postgres mysql mysql-plain postgres-tls mongo redis redis-open redis-tls

  # The Keychain tests are ignored by default and panic unless the run proves it targets a
  # disposable keychain: `ZS_CI_KEYCHAIN` must name a keychain file under RUNNER_TEMP that is
  # the user default keychain and the only user search-list entry. Only the lock tests need
  # the password: it is masked and written to a 0600 file whose path only the create, native
  # adapter, process and delete steps receive. The job builds the whole agent. A locked
  # keychain is refused by the agent's lock check, so no step waits out the 30 s bound.
  macos-native:
    needs: macos-guard
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Create disposable keychain
        env:
          ZS_CI_KEYCHAIN: ${{ runner.temp }}/zerosecret-native.keychain-db
          ZS_CI_KEYCHAIN_PASSWORD_FILE: ${{ runner.temp }}/zerosecret-native.keychain-password
        run: |
          set -euo pipefail
          password=$(openssl rand -hex 16)
          echo "::add-mask::$password"
          (umask 077 && printf '%s' "$password" > "$ZS_CI_KEYCHAIN_PASSWORD_FILE")
          security create-keychain -p "$password" "$ZS_CI_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$ZS_CI_KEYCHAIN"
          security unlock-keychain -p "$password" "$ZS_CI_KEYCHAIN"
          security default-keychain -d user -s "$ZS_CI_KEYCHAIN"
          security list-keychains -d user -s "$ZS_CI_KEYCHAIN"
      # The filter also matches the ignored native tests of `tests_macos`, counted as ignored.
      - name: Core CA storage tests
        run: |
          set -euo pipefail
          log=$(mktemp)
          cargo test --locked -p zs-mitm ca::platform::tests -- --test-threads=1 | tee "$log"
          grep -Fq "test result: ok. 104 passed; 0 failed; 19 ignored;" "$log" || { echo "expected exactly 104 core CA storage tests to pass" >&2; exit 1; }
      - name: Native macOS CA adapter tests
        timeout-minutes: 8
        env:
          ZS_CI_KEYCHAIN: ${{ runner.temp }}/zerosecret-native.keychain-db
          ZS_CI_KEYCHAIN_PASSWORD_FILE: ${{ runner.temp }}/zerosecret-native.keychain-password
        run: |
          set -euo pipefail
          log=$(mktemp)
          cargo test --locked -p zs-mitm native_ca_macos_ -- --ignored --test-threads=1 --show-output | tee "$log"
          grep -Fq "test result: ok. 19 passed; 0 failed; 0 ignored;" "$log" || { echo "expected exactly 19 native macOS CA tests to pass" >&2; exit 1; }
      - name: Native macOS device record tests
        timeout-minutes: 8
        env:
          ZS_CI_KEYCHAIN: ${{ runner.temp }}/zerosecret-native.keychain-db
          ZS_CI_KEYCHAIN_PASSWORD_FILE: ${{ runner.temp }}/zerosecret-native.keychain-password
        run: |
          set -euo pipefail
          log=$(mktemp)
          cargo test --locked -p zs-mitm native_device_macos_ -- --ignored --test-threads=1 --show-output | tee "$log"
          grep -Fq "test result: ok. 3 passed; 0 failed; 0 ignored;" "$log" || { echo "expected exactly 3 native macOS device record tests to pass" >&2; exit 1; }
      - name: Keychain integration tests
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        env:
          ZS_CI_KEYCHAIN: ${{ runner.temp }}/zerosecret-native.keychain-db
        run: |
          set -euo pipefail
          log=$(mktemp)
          cargo test --locked -p zs-mitm --test keychain -- --ignored --test-threads=1 | tee "$log"
          grep -Fq "test result: ok. 7 passed; 0 failed; 0 ignored;" "$log" || { echo "expected exactly 7 Keychain integration tests to pass" >&2; exit 1; }
      - name: Build macOS CA process tests
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: cargo test --locked -p zs --test platform_ca_startup --no-run
      - name: macOS CA process tests
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          ZS_CI_KEYCHAIN: ${{ runner.temp }}/zerosecret-native.keychain-db
          ZS_CI_KEYCHAIN_PASSWORD_FILE: ${{ runner.temp }}/zerosecret-native.keychain-password
        run: |
          set -euo pipefail
          log=$(mktemp)
          cargo test --locked -p zs --test platform_ca_startup -- --ignored --skip common::zs_test_child --test-threads=1 | tee "$log"
          grep -Fq "test result: ok. 15 passed; 0 failed; 0 ignored;" "$log" || { echo "expected exactly 15 macOS CA process tests to pass" >&2; exit 1; }
      # The real verifier drives the real agent through one synthetic HTTPS workload with
      # secure CA startup in this disposable keychain, then once more expecting a different
      # credential, which must fail on the auth mismatch alone. `zs-verify` has no library
      # target, so the test finds the binary next to `zs`, built here into the same target
      # directory. The test prints only a predicate summary of each JSON report (counts,
      # booleans, file counts, each vector's status and finding), never a credential. It
      # needs no keychain password.
      - name: Hardened verifier evidence on secure CA startup
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          ZS_CI_KEYCHAIN: ${{ runner.temp }}/zerosecret-native.keychain-db
        run: |
          set -euo pipefail
          cargo build --locked -p zs-verify --bin zs-verify
          cargo test --locked -p zs --test verifier_ca_evidence --no-run
          log=$(mktemp)
          cargo test --locked -p zs --test verifier_ca_evidence -- --ignored --skip common::zs_test_child --test-threads=1 --show-output | tee "$log"
          grep -Fq "test result: ok. 1 passed; 0 failed; 0 ignored;" "$log" || { echo "expected exactly 1 hardened verifier evidence test to pass" >&2; exit 1; }
      - name: Delete disposable keychain
        if: always()
        env:
          ZS_CI_KEYCHAIN: ${{ runner.temp }}/zerosecret-native.keychain-db
          ZS_CI_KEYCHAIN_PASSWORD_FILE: ${{ runner.temp }}/zerosecret-native.keychain-password
        run: |
          rm -f "$ZS_CI_KEYCHAIN_PASSWORD_FILE"
          test ! -e "$ZS_CI_KEYCHAIN_PASSWORD_FILE"
          security delete-keychain "$ZS_CI_KEYCHAIN"
          test ! -e "$ZS_CI_KEYCHAIN"
          ! security list-keychains -d user | grep -Fq "\"$ZS_CI_KEYCHAIN\""

  linux-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config dbus-daemon dbus-bin gnome-keyring libsecret-tools
      - run: cargo clippy --locked -p zs-mitm --lib --bins -- -D warnings
      - run: cargo clippy --locked -p zs-mitm --tests --benches -- -D warnings -A clippy::unwrap_used -A clippy::expect_used -A clippy::panic
      # The filter also matches the ignored native tests of `tests_linux`, counted as ignored.
      - name: Core CA storage tests
        run: |
          set -euo pipefail
          log=$(mktemp)
          cargo test --locked -p zs-mitm ca::platform::tests -- --test-threads=1 | tee "$log"
          grep -Fq "test result: ok. 89 passed; 0 failed; 12 ignored;" "$log" || { echo "expected exactly 89 core CA storage tests to pass" >&2; exit 1; }
      - run: cargo check --locked -p zs --lib --bins
      - run: |
          set -euo pipefail
          log=$(mktemp)
          cargo test --locked -p zs-mitm native_ca_linux_ -- --ignored --test-threads=1 | tee "$log"
          grep -Fq "test result: ok. 12 passed; 0 failed; 0 ignored;" "$log" || { echo "expected exactly 12 native Linux CA tests to pass" >&2; exit 1; }
      - run: |
          set -euo pipefail
          log=$(mktemp)
          cargo test --locked -p zs-mitm native_device_linux_ -- --ignored --test-threads=1 | tee "$log"
          grep -Fq "test result: ok. 3 passed; 0 failed; 0 ignored;" "$log" || { echo "expected exactly 3 native Linux device record tests to pass" >&2; exit 1; }
      - run: |
          set -euo pipefail
          log=$(mktemp)
          cargo test --locked -p zs --test platform_ca_startup -- --ignored --skip common::zs_test_child --test-threads=1 | tee "$log"
          grep -Fq "test result: ok. 11 passed; 0 failed; 0 ignored;" "$log" || { echo "expected exactly 11 Linux CA process tests to pass" >&2; exit 1; }
      # Agent-spawning tests reach the session bus they inherit, and `TestHome` deletes the
      # exact item each test's `.ca-storage-id` names (service `zerosecret.ca.v1`, that
      # account, schema 1). Run one such file against a private session bus with a disposable
      # keyring, then require no `zerosecret.ca.v1` item left there. A planted canary must be
      # counted exactly once first, so a count that sees nothing cannot pass as zero. The
      # count prints object paths only, never a secret. The bus and keyring are this step's
      # own; the keyring is unlocked with a random password and lives under a temp directory.
      - name: Agent-spawning tests leave no CA item on a private bus
        timeout-minutes: 12
        run: |
          set -euo pipefail
          cargo test --locked -p zs --test absolute_uri --no-run
          root=$(mktemp -d)
          mkdir -p "$root/data"
          isolated=(env -i PATH="$PATH" HOME="$root" XDG_RUNTIME_DIR="$root" XDG_DATA_HOME="$root/data" XDG_CONFIG_HOME="$root/data" XDG_CACHE_HOME="$root/data")
          bus_pid=
          keyring_pid=
          trap 'kill $keyring_pid $bus_pid 2> /dev/null || true' EXIT
          "${isolated[@]}" dbus-daemon --session --nofork --address="unix:path=$root/bus" --print-address=1 < /dev/null > "$root/address" 2> /dev/null &
          bus_pid=$!
          for _ in $(seq 200); do [ -s "$root/address" ] && break; sleep 0.05; done
          address=$(head -n 1 "$root/address")
          case $address in "unix:path=$root/bus,"*) ;; *) echo "private session bus did not start" >&2; exit 1 ;; esac
          export DBUS_SESSION_BUS_ADDRESS="$address"
          openssl rand -hex 16 | "${isolated[@]}" DBUS_SESSION_BUS_ADDRESS="$address" gnome-keyring-daemon --foreground --unlock --components=secrets > /dev/null 2>&1 &
          keyring_pid=$!
          send() { dbus-send --session --print-reply --reply-timeout=10000 "$@" 2> /dev/null; }
          secrets() { send --dest=org.freedesktop.secrets "$@"; }
          # Ask for the name's owner first, so no call auto-starts a second, locked keyring.
          ready() {
            send --dest=org.freedesktop.DBus /org/freedesktop/DBus org.freedesktop.DBus.NameHasOwner string:org.freedesktop.secrets | grep -F 'boolean true' > /dev/null || return 1
            collection=$(secrets /org/freedesktop/secrets org.freedesktop.Secret.Service.ReadAlias string:default | sed -n 's/^ *object path "\(.*\)"$/\1/p')
            [ -n "$collection" ] && [ "$collection" != / ] || return 1
            secrets "$collection" org.freedesktop.DBus.Properties.Get string:org.freedesktop.Secret.Collection string:Locked | grep -F 'boolean false' > /dev/null
          }
          for _ in $(seq 200); do ready && break; sleep 0.05; done
          ready || { echo "private secret service did not start" >&2; exit 1; }
          log=$(mktemp)
          cargo test --locked -p zs --test absolute_uri -- --test-threads=1 | tee "$log"
          grep -Fq "test result: ok. 5 passed; 0 failed; 1 ignored;" "$log" || { echo "expected exactly 5 agent-spawning tests to pass" >&2; exit 1; }
          count() {
            secrets /org/freedesktop/secrets org.freedesktop.Secret.Service.SearchItems dict:string:string:service,zerosecret.ca.v1 | { grep -c '^ *object path ' || true; }
          }
          printf canary | secret-tool store --label=zs-ci-record-canary service zerosecret.ca.v1 account zs-ci-record-canary
          seen=$(count)
          secret-tool clear service zerosecret.ca.v1 account zs-ci-record-canary
          left=$(count)
          echo "zerosecret.ca.v1 items: $seen with the canary, $left after deleting it"
          if [ "$seen" -ne 1 ] || [ "$left" -ne 0 ]; then
            echo "expected exactly the canary, then no zerosecret.ca.v1 item" >&2
            exit 1
          fi

