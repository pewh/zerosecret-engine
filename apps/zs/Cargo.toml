[package]
name = "zs"
build = "build.rs"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
zs-audit.workspace = true
zs-diag.workspace = true
zs-credential.workspace = true
zs-identity.workspace = true
zs-mitm.workspace = true
zs-protocol.workspace = true
zs-proto-http.workspace = true
zs-proto-postgres.workspace = true
zs-proto-mysql.workspace = true
zs-proto-mongo.workspace = true
zs-upstream = { workspace = true, features = ["reqwest"] }
rustls-pki-types.workspace = true
zs-wire.workspace = true
zs-grant.workspace = true
zs-policy.workspace = true
zs-materializer.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
sha2.workspace = true
reqwest.workspace = true
ed25519-dalek.workspace = true
base64.workspace = true
rcgen.workspace = true
rand.workspace = true
async-trait.workspace = true

[dev-dependencies]
tempfile.workspace = true
hmac.workspace = true
sha1.workspace = true
md-5.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
axum.workspace = true
zs-test-aws.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
zs-test-keychain.workspace = true

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
