[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained notice, not a vulnerability; only cedar-policy-core 4.14 uses it, through its default datetime feature that cedar-policy always enables; remove when cedar drops chrono" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "BSD-2-Clause", "ISC", "Unicode-3.0", "CDLA-Permissive-2.0", "Zlib"]

[bans]
multiple-versions = "warn"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
