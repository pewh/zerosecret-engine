[package]
name = "zs-mitm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
base64.workspace = true
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde_json.workspace = true
sha2.workspace = true
zs-audit.workspace = true
zs-credential.workspace = true
zs-diag.workspace = true
zs-identity.workspace = true
zs-protocol.workspace = true
zs-proto-http.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tower = { version = "0.5", default-features = false }
rustls.workspace = true
webpki-roots.workspace = true
rcgen.workspace = true
rand.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = { workspace = true, features = ["crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
zs-test-keychain.workspace = true
