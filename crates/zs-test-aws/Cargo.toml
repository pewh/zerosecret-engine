[package]
name = "zs-test-aws"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
zs-upstream = { workspace = true, features = ["reqwest"] }
tokio.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
rcgen.workspace = true
rand.workspace = true
base64.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
form_urlencoded = "1"
jsonwebtoken = { version = "10", default-features = false }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
signature = "2.2"
aws-sigv4 = { version = "1", default-features = false, features = ["sign-http", "http1"] }
aws-credential-types = { version = "1", default-features = false }
aws-smithy-runtime-api = { version = "1", default-features = false, features = ["client"] }

[dev-dependencies]
reqwest.workspace = true
zs-policy.workspace = true
zs-proto-http.workspace = true
