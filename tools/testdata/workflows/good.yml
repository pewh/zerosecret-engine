name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: echo build

  publish:
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' && vars.ZS_RELEASE_BINARIES == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - run: echo publish
